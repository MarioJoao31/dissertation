        <title id="static-analysis-flow-findings-title">Analysis flow, stages 3 to 5</title>
        <desc id="static-analysis-flow-findings-desc">The inventory records what the server exposes, versioning reads declared MCP versions, and bandit hits that map to a PentestCategory are attributed to a tool and given remediation before landing in the result JSON.</desc>
