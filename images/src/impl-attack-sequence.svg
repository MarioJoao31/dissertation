      #architecture-attack-sequence-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-attack-sequence-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-attack-sequence-root .diagram-container { overflow-x: visible; }</style>
