        <title id="architecture-attack-sequence-title">Attack phase, condensed</title>
        <desc id="architecture-attack-sequence-desc">Sequence in which approving a job starts a background run that, per tool, filters payload combos, has the LLM synthesize arguments, calls the target MCP tool, judges the results, and persists every attempt and the final report.</desc>
