<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 1056" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="readme-pipeline-title readme-pipeline-desc" id="readme-pipeline-root">
        <title id="readme-pipeline-title">Scan pipeline: discover, approve, attack, report</title>
        <desc id="readme-pipeline-desc">Pipeline of the MCP security tool: it connects to an MCP server, discovers its capabilities and has Jev categorize them into the pentest taxonomy read-only, waits for a human approval via POST /attack, then the attack executor combines the payload library with LLM-synthesized arguments to send live tool calls, scores each response with a rule-based evaluator and an LLM judge, and stores the resulting findings in Postgres and a JSON or Markdown report.</desc>
